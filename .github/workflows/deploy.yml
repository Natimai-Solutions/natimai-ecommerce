# Déploiement manuel : construit les images du commit choisi, les pousse sur
# GHCR, puis les met en service sur le serveur par SSH.
#
# Actions → « Deploy » → Run workflow → choisir la référence (branche, tag ou
# sha) et l'environnement. Pour revenir en arrière : relancer avec le commit
# précédent (les migrations, elles, ne redescendent pas : docs/DEPLOYMENT.md §8).
#
# Configuration, dans Settings → Environments → staging / production :
#   variables  VITE_API_URL   https://api.<domaine> (figée dans les frontends)
#              VITE_PUBLIC_SITE_URL https://<domaine> (canonical, sitemap — R8 / U6)
#              VITE_SENTRY_DSN DSN Sentry des navigateurs (facultatif, R8 / U3)
#              APP_DIR        dossier du dépôt sur le serveur
#                             (défaut /home/deploy/natimai-ecommerce)
#              SSH_PORT       défaut 22
#   secrets    SSH_HOST, SSH_USER, SSH_PRIVATE_KEY,
#              SSH_KNOWN_HOSTS (sortie de `ssh-keyscan -p <port> <hôte>`)
# Le .env de l'application reste sur le serveur ; il ne passe pas par GitHub.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branche, tag ou sha à déployer
        required: true
        default: main
      environment:
        description: Environnement cible
        type: choice
        options: [staging, production]
        default: staging
      skip_ci_check:
        description: Déployer même si la CI n'est pas verte sur ce commit
        type: boolean
        default: false

# Un seul déploiement à la fois par environnement, jamais interrompu en cours.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

# Pas d'enregistrement de build (artefact par image) : il compte dans le
# quota de stockage des artefacts, qui a déjà été atteint.
env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

permissions:
  contents: read

jobs:
  resolve:
    name: Commit et CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      image_prefix: ${{ steps.sha.outputs.image_prefix }}
      image_tag: ${{ steps.sha.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Résoudre le commit
        id: sha
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # GHCR n'accepte que des noms en minuscules.
          echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # Les frontends embarquent l'URL de l'API de l'environnement : le
          # tag porte l'environnement pour que staging et production ne
          # s'écrasent pas.
          echo "image_tag=${TARGET_ENV}-${sha}" >> "$GITHUB_OUTPUT"
          echo "Commit : $sha"

      - name: Vérifier que la CI est verte
        if: ${{ !inputs.skip_ci_check }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success" --jq '.total_count')"
          if [[ "$count" == "0" ]]; then
            echo "::error::Aucune CI verte pour $SHA. Attendre la CI, ou relancer avec « skip_ci_check »."
            exit 1
          fi

  build:
    name: Image ${{ matrix.image }}
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            context: ./backend
            file: ./backend/Dockerfile
          - image: frontend
            context: .
            file: ./frontend/Dockerfile
          - image: admin
            context: .
            file: ./admin-frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Vérifier VITE_API_URL
        if: matrix.image != 'api'
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [[ "$VITE_API_URL" != https://* ]]; then
            echo "::error::Variable d'environnement GitHub VITE_API_URL absente ou pas en https (ex. https://api.exemple.pf)."
            exit 1
          fi

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # Jour UTC : invalide chaque jour la couche « apk/apt upgrade » du cache
      # (ARG SECURITY_UPDATES_DATE des Dockerfile).
      - id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          # --pull : les images de base sont des tags flottants.
          pull: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_PUBLIC_SITE_URL=${{ vars.VITE_PUBLIC_SITE_URL }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=${{ inputs.environment }}
            VITE_APP_RELEASE=${{ needs.resolve.outputs.sha }}
            SECURITY_UPDATES_DATE=${{ steps.today.outputs.date }}
          tags: ${{ needs.resolve.outputs.image_prefix }}/${{ matrix.image }}:${{ needs.resolve.outputs.image_tag }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ inputs.environment }}-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.environment }}-${{ matrix.image }}

  deploy:
    name: Mise en service (${{ inputs.environment }})
    needs: [resolve, build]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.VITE_API_URL }}
    permissions:
      # write : les tags « deployed-<env>… » posés après la mise en service.
      contents: write
      packages: read
    steps:
      - name: Préparer SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [[ -z "$SSH_PRIVATE_KEY" || -z "$SSH_KNOWN_HOSTS" ]]; then
            echo "::error::Secrets SSH_PRIVATE_KEY et SSH_KNOWN_HOSTS requis dans l'environnement."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Déployer
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          APP_DIR: ${{ vars.APP_DIR || '/home/deploy/natimai-ecommerce' }}
          SHA: ${{ needs.resolve.outputs.sha }}
          IMAGE_PREFIX: ${{ needs.resolve.outputs.image_prefix }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          API_URL: ${{ vars.VITE_API_URL }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Le dépôt passe d'abord sur le commit déployé (fichiers compose,
          # Caddyfile, script), puis le script de ce commit fait le reste.
          remote="set -euo pipefail
          cd $(printf %q "$APP_DIR")
          # </dev/null : le transport SSH de git lirait sinon le jeton.
          git fetch --quiet --tags origin </dev/null
          git checkout --quiet --detach $(printf %q "$SHA") </dev/null
          IMAGE_PREFIX=$(printf %q "$IMAGE_PREFIX") \
          IMAGE_TAG=$(printf %q "$IMAGE_TAG") \
          API_URL=$(printf %q "$API_URL") \
          GHCR_USER=$(printf %q "$GHCR_USER") \
          ./scripts/release/deploy.sh"
          # Le jeton GHCR passe par l'entrée standard, jamais en argument.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "bash -c $(printf %q "$remote")"

      - name: Nettoyer
        if: always()
        run: rm -f ~/.ssh/deploy_key

      # Trace de ce qui tourne (R8 / U11) : un tag horodaté par mise en
      # service et un tag mobile « deployed-<env> » sur le commit en
      # production. Revenir en arrière = relancer ce workflow avec le tag
      # horodaté précédent (Actions → Deploy → ref) ; les images de ce commit
      # sont encore sur GHCR.
      - name: Poser les tags de déploiement
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/deployed-$TARGET_ENV-$stamp" -f sha="$SHA" >/dev/null
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/deployed-$TARGET_ENV" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/deployed-$TARGET_ENV" \
              -f sha="$SHA" -F force=true >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/deployed-$TARGET_ENV" -f sha="$SHA" >/dev/null
          fi
          echo "Tags : deployed-$TARGET_ENV-$stamp, deployed-$TARGET_ENV → $SHA"
