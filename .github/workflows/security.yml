# Sécurité en continu (R8 / U1) : secrets commis, dépendances vulnérables,
# analyse statique, images Docker.
#
# Minutes comptées (dépôt privé, 18/11/2026) :
# - sur une PR prête (pas en brouillon) : gitleaks à chaque fois, les audits
#   de dépendances quand un manifeste ou un verrou change, la construction des
#   images et Trivy quand un Dockerfile ou un verrou change ; les trois
#   premiers dans un seul job (chacun coûtait au moins une minute) ;
# - tout, CodeQL compris, au passage hebdomadaire (les bases de
#   vulnérabilités évoluent sans qu'une ligne du dépôt ne change) et à la
#   demande ; plus de passage à la fusion sur main.
#
# Ce qui bloque la fusion : un secret détecté, une vulnérabilité connue dans
# une dépendance Python ou JavaScript de production (niveau « moderate » ou
# plus), une image qui ne se construit pas, une vulnérabilité CRITICAL / HIGH
# corrigée en amont dans une image. Les vulnérabilités sans correctif
# disponible sont listées, pas bloquantes (rien à faire côté dépôt).
#
# CodeQL demande GitHub Code Security sur un dépôt privé (Settings → Code
# security → Code scanning) : le job ne s'exécute que lorsque la variable de
# dépôt CODEQL_ENABLED vaut « true » (ou si le dépôt est public).
name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Lundi 05:00 UTC : avant la journée, après les publications du week-end.
    - cron: "0 5 * * 1"
  workflow_dispatch:

# Pas d'enregistrement de build (artefact par image) : il compte dans le
# quota de stockage des artefacts, qui a déjà été atteint.
env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Périmètre des changements
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      javascript: ${{ steps.filter.outputs.javascript }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            python:
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - '.github/workflows/security.yml'
            javascript:
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/security.yml'
            images:
              - '**/Dockerfile'
              - '**/.dockerignore'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'infra/**'
              - '.github/workflows/security.yml'

  # gitleaks, pip-audit et pnpm audit dans un seul job : chacun coûtait au
  # moins une minute facturée pour quelques secondes de travail.
  secrets-and-deps:
    name: Secrets commis et dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: >-
      !cancelled() && (github.event_name != 'pull_request'
      || needs.changes.result == 'success')
    env:
      AUDIT_PYTHON: ${{ github.event_name != 'pull_request' || needs.changes.outputs.python == 'true' }}
      AUDIT_JS: ${{ github.event_name != 'pull_request' || needs.changes.outputs.javascript == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tout l'historique : un secret retiré au commit suivant reste un secret.
          fetch-depth: 0
      # Le binaire gitleaks (MIT) plutôt que gitleaks-action : l'action exige
      # une licence pour les dépôts d'organisation (GITLEAKS_LICENSE) et le
      # job n'a jamais tourné sans. Version et empreinte figées ; les mettre à
      # jour ensemble (gitleaks_<version>_checksums.txt de la release).
      - name: gitleaks sur tout l'historique
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          cd "$RUNNER_TEMP"
          curl -sSL --fail --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          # --redact : les valeurs trouvées ne sont jamais écrites dans le journal.
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose --no-banner --exit-code 1 .

      - if: env.AUDIT_PYTHON == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - if: env.AUDIT_PYTHON == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: latest
      - name: pip-audit sur le verrou de production
        if: env.AUDIT_PYTHON == 'true'
        working-directory: backend
        env:
          UV_PYTHON: "3.14"
          UV_PYTHON_PREFERENCE: only-system
        # Le verrou (uv.lock) est la vérité de l'image : exporté sans le groupe
        # dev ni le projet lui-même, puis audité tel quel (--no-deps : pas de
        # résolution, exactement ces versions).
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project \
            --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --disable-pip --no-deps --strict

      - if: env.AUDIT_JS == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - if: env.AUDIT_JS == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      # pnpm audit lit le verrou : pas d'installation des dépendances.
      # Les dépendances de production (vitrine, admin, serveur SSR) bloquent dès
      # « moderate » ; l'outillage de dev est audité à titre indicatif.
      - name: Dépendances JavaScript de production
        if: env.AUDIT_JS == 'true'
        run: pnpm audit --prod --audit-level=moderate
      - name: Outillage JavaScript de développement (indicatif)
        if: env.AUDIT_JS == 'true'
        continue-on-error: true
        run: pnpm audit --audit-level=high

  codeql:
    name: CodeQL (${{ matrix.language }})
    # Hebdomadaire et à la demande : l'analyse prend plusieurs minutes par
    # langage, trop pour chaque push d'une PR.
    if: >-
      github.event_name != 'pull_request'
      && (github.event.repository.visibility == 'public' || vars.CODEQL_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  images:
    name: Image ${{ matrix.image }} (build + Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    # Une image ne change de contenu vulnérable qu'avec son Dockerfile ou ses
    # dépendances : sur une PR, seulement quand l'un d'eux change.
    if: >-
      !cancelled() && (github.event_name != 'pull_request'
      || (needs.changes.result == 'success' && needs.changes.outputs.images == 'true'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./backend
            file: ./backend/Dockerfile
          - image: frontend
            context: .
            file: ./frontend/Dockerfile
          - image: admin
            context: .
            file: ./admin-frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      # Jour UTC : invalide chaque jour la couche « apk/apt upgrade » du cache
      # (ARG SECURITY_UPDATES_DATE des Dockerfile).
      - id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # Même recette que le déploiement (deploy.yml), sans publication : une
      # image qui ne se construit plus est détectée sur la PR, pas le jour du
      # déploiement.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          pull: true
          build-args: |
            VITE_API_URL=https://api.example.invalid
            SECURITY_UPDATES_DATE=${{ steps.today.outputs.date }}
          tags: natimai/${{ matrix.image }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image }}
      - name: Trivy — vulnérabilités corrigées en amont (bloquant)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: natimai/${{ matrix.image }}:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db
      - name: Trivy — vulnérabilités sans correctif (indicatif)
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: natimai/${{ matrix.image }}:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"
          skip-setup-trivy: true
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db
