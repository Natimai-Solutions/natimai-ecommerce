name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  build:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/api:latest,${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:latest,${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: admin-frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/admin:latest,${{ env.IMAGE_PREFIX }}/admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update image tags in manifests
        run: |
          SHA=${{ github.sha }}
          sed -i "s|/api:latest|/api:${SHA}|g"      infra/k8s/backend/deployment.yaml
          sed -i "s|/api:latest|/api:${SHA}|g"      infra/k8s/backend/migrate-job.yaml
          sed -i "s|/frontend:latest|/frontend:${SHA}|g" infra/k8s/frontend/deployment.yaml
          sed -i "s|/admin:latest|/admin:${SHA}|g"   infra/k8s/admin/deployment.yaml

      - name: Replace placeholders
        run: |
          OWNER=${{ github.repository_owner }}
          REPO=${{ github.event.repository.name }}
          DOMAIN=${{ secrets.DOMAIN }}
          EMAIL=${{ secrets.LETSENCRYPT_EMAIL }}
          find infra/k8s -name "*.yaml" -exec sed -i \
            "s|GITHUB_OWNER|${OWNER}|g; s|REPO_NAME|${REPO}|g; s|YOURDOMAIN.COM|${DOMAIN}|g; s|LETSENCRYPT_EMAIL|${EMAIL}|g" {} +

      - name: Apply namespace & base resources
        run: |
          kubectl apply -f infra/k8s/00-namespace.yaml
          kubectl apply -f infra/k8s/02-redis.yaml
          kubectl apply -f infra/k8s/clamav/deployment.yaml

      - name: Sync Kubernetes secrets from GitHub Secrets
        run: |
          kubectl create secret generic app-secrets \
            --namespace=ecommerce \
            --from-literal=SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --from-literal=REDIS_URL="redis://redis:6379" \
            --from-literal=INGRAM_CLIENT_ID="${{ secrets.INGRAM_CLIENT_ID }}" \
            --from-literal=INGRAM_CLIENT_SECRET="${{ secrets.INGRAM_CLIENT_SECRET }}" \
            --from-literal=INGRAM_CUSTOMER_NUMBER="${{ secrets.INGRAM_CUSTOMER_NUMBER }}" \
            --from-literal=ICECAT_USERNAME="${{ secrets.ICECAT_USERNAME }}" \
            --from-literal=ICECAT_API_KEY="${{ secrets.ICECAT_API_KEY }}" \
            --from-literal=MAILGUN_API_KEY="${{ secrets.MAILGUN_API_KEY }}" \
            --from-literal=MAILGUN_DOMAIN="${{ secrets.MAILGUN_DOMAIN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Run database migrations
        run: |
          # Delete previous migration job if it exists
          kubectl delete job migrate --namespace=ecommerce --ignore-not-found
          kubectl apply -f infra/k8s/backend/migrate-job.yaml
          kubectl wait --for=condition=complete job/migrate --namespace=ecommerce --timeout=120s

      - name: Deploy application
        run: |
          kubectl apply -f infra/k8s/backend/deployment.yaml
          kubectl apply -f infra/k8s/backend/service.yaml
          kubectl apply -f infra/k8s/frontend/deployment.yaml
          kubectl apply -f infra/k8s/admin/deployment.yaml
          kubectl apply -f infra/k8s/ingress/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend  --namespace=ecommerce --timeout=120s
          kubectl rollout status deployment/frontend --namespace=ecommerce --timeout=120s
          kubectl rollout status deployment/admin    --namespace=ecommerce --timeout=120s
