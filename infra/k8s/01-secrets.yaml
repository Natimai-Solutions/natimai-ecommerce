# Secret template — actual values are injected by the CI/CD pipeline via GitHub Secrets.
# DO NOT commit real values here.
# The deploy workflow runs: kubectl create secret generic app-secrets --from-env-file=... --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ecommerce
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_ME"
  DATABASE_URL: "postgresql+asyncpg://USER:PASSWORD@MANAGED_DB_HOST:5432/fastapi_ecommerce"
  REDIS_URL: "redis://redis:6379"
  INGRAM_CLIENT_ID: "REPLACE_ME"
  INGRAM_CLIENT_SECRET: "REPLACE_ME"
  INGRAM_CUSTOMER_NUMBER: "REPLACE_ME"
  ICECAT_USERNAME: "REPLACE_ME"
  ICECAT_API_KEY: "REPLACE_ME"
