[project]
name = "app"
version = "0.1.0"
description = ""
# 3.11 : datetime.UTC et ExceptionGroup sont utilisés ; borne haute = la version
# que la CI et l'image (python:3.14-slim) exercent, +1 mineure.
requires-python = ">=3.11,<3.15"
dependencies = [
    # `standard` embarque depuis la 0.13x un CLI de déploiement FastAPI Cloud
    # (fastapi-cloud-cli, fastar, rignore). Ce projet se déploie par docker
    # compose : autant ne pas l'embarquer dans l'image de production.
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1,<1.0.0",
    "python-multipart<1.0.0,>=0.0.7",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "tenacity>=9.1.4,<10.0.0",
    "pydantic>=2.13.5",
    "jinja2<4.0.0,>=3.1.4",
    "alembic>=1.20.0,<2.0.0",
    "httpx>=0.25.1,<1.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "sqlmodel>=0.0.47,<1.0.0",
    # Plus de pin figé : le pin existait parce que passlib lisait
    # bcrypt.__about__, disparu en 4.1. passlib est retiré, la contrainte
    # tombe avec lui.
    "bcrypt>=4.0.1,<6.0.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]>=2.68.1",
    "pyjwt>=2.15.1,<3.0.0",
    "arq>=0.28.0",
    # Borne haute alignée sur ce qu'arq autorise réellement : toutes ses
    # versions, 0.28.0 comprise, exigent `redis[hiredis]>=4.2.0,<6`. Sans cette
    # borne, la déclaration laisse croire que redis 6/7/8 est possible et
    # Dependabot échoue en boucle à résoudre le fichier. Ne la retirer que le
    # jour où arq élargira sa propre contrainte.
    "redis>=5.0.0,<6.0.0",
    "aiohttp>=3.8.0", # Pour les appels API REST Ingram Micro
    "boto3>=1.43.103", # S3 file storage for payment attachments
    "clamd>=1.0.2", # ClamAV antivirus scanner for uploaded documents
    "pyyaml>=6.0.3", # Lecture de spec_definitions.yaml pour les specs filtrables
    # Rendu PDF des factures (M3). Nécessite des libs système (pango, cairo,
    # gdk-pixbuf) présentes dans l'image backend ; l'import est paresseux dans
    # app/features/invoice/services/pdf.py pour qu'un poste dev sans GTK
    # (Windows) ne casse que le rendu PDF.
    "weasyprint>=70.0",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    # Chiffrement (Fernet) des identifiants des fournisseurs par flux fichier
    # (app/core/secrets_box.py).
    "cryptography>=44.0.0",
    # QR code (SVG) of the administrators' two-factor enrolment; pure Python.
    "segno>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    # Tests only: kept out of the production image (uv sync --no-dev).
    "pytest-asyncio>=1.0.0",
    "pytest-mock>=3.14.0",
    "mypy>=2.0.0",
    "ruff>=0.16.9,<1.0.0",
    "coverage>=7.16.1,<8.0.0",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[[tool.mypy.overrides]]
# WeasyPrint ships no type stubs; it is imported lazily in one place
# (app/features/invoice/services/pdf.py) behind a typed wrapper.
module = ["weasyprint.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# openpyxl ships no type stubs; it is imported lazily behind a typed wrapper
# in app/services/suppliers/file_import.py (Excel catalog imports).
module = ["openpyxl.*"]
ignore_missing_imports = true

[tool.ruff]
# Reste « py310 » : « py311 » active UP042 (StrEnum) sur 23 énumérations
# `(str, Enum)` dont `str()` sert dans des libellés et des journaux ; la
# migration vers StrEnum change ce rendu et se fera à part, pas en lint.
target-version = "py311"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/tests/*",
    "app/alembic/*",
    "app/scripts/*",
    # External API clients & background tasks: exercised via integration/manual
    # tests, not unit tests (unit-testing them is just HTTP mocking).
    "app/services/icecat_service.py",
    "app/services/suppliers/ingram_micro.py",
    # app/tasks/* measured since R8 / U10 (the sweeps, syncs and pricing
    # refreshes have integration tests of their own); only the two external
    # clients above stay out.
    # Run-once seeding & ops/monitoring infra.
    "app/features/initial_data.py",
    "app/outbox/health.py",
    "app/outbox/health_scheduler.py",
]

[tool.coverage.report]
show_missing = true
# Gate the build: CI fails when coverage regresses under this % (audit Q2,
# 25/08/2026 — measured ~64.8 % at the current omit scope; raise over time).
# 04/09/2026 (Q3): measured 71 % on main and 73 % with the Q3 tests — raised
# to 68 to keep a few points of margin. Never lower it to get a PR through.
fail_under = 68
