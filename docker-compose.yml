# docker-compose.yml

services:
  postgres:
    image: postgres:16-alpine  # Plus léger avec Alpine
    environment:
      POSTGRES_DB: fastapi_ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.2-alpine  # Version plus spécifique
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 30s

  # Antivirus engine used to scan payment attachments (purchase orders, etc.)
  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # Service API FastAPI
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["api"]
    volumes:
      # Uploaded attachments (BC, etc.) — shared with arq-worker (AV scan) and
      # persisted across restarts/rebuilds. Without this, files live in the
      # container's ephemeral /tmp and are lost / invisible to the worker.
      - storage_data:/tmp/fastapi_ecommerce_storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/fastapi_ecommerce
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fastapi_ecommerce
      - REDIS_URL=redis://redis:6379
      - WORKERS=4
      - LOG_LEVEL=INFO
      - CLAMAV_ENABLED=true
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service ARQ Worker
  arq-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["worker"]
    volumes:
      # Same shared storage as the API: the AV scan reads the uploaded file here.
      - storage_data:/tmp/fastapi_ecommerce_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # NB: intentionally NOT gated on clamav — the worker processes ALL outbox
      # events (order status, emails…), so it must run even if clamav is down.
      # The AV scan handler re-raises on a not-ready scanner so ARQ retries it.
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/fastapi_ecommerce
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fastapi_ecommerce
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
      - CLAMAV_ENABLED=true
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
    restart: unless-stopped

  # Service Outbox Poller
  outbox-poller:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: ["poller", "--mode", "continuous", "--interval", "5"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/fastapi_ecommerce
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fastapi_ecommerce
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
    restart: unless-stopped

  # Migration (optionnel, pour les déploiements)
  migrate:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/fastapi_ecommerce
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fastapi_ecommerce
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  admin-frontend:
    build:
      context: .
      dockerfile: admin-frontend/Dockerfile
    ports:
      - "3001:80"
    environment:
      - PORT=3001
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  adminer:
    image: adminer
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    ports:
      - "8080:8080"
volumes:
  postgres_data:
  redis_data:  # Ajouter volume pour Redis
  clamav_data:  # Cache pour les signatures virales ClamAV
  storage_data:  # Pièces jointes uploadées (BC…) — partagé API/worker, persistant