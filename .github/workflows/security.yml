# Sécurité en continu (R8 / U1) : secrets commis, dépendances vulnérables,
# analyse statique, images Docker. Sur chaque PR et chaque push sur main, plus
# un passage hebdomadaire pour les bases de vulnérabilités qui évoluent sans
# qu'une ligne du dépôt ne change.
#
# Ce qui bloque la fusion : un secret détecté, une vulnérabilité connue dans
# une dépendance Python ou JavaScript de production (niveau « moderate » ou
# plus), une image qui ne se construit pas, une vulnérabilité CRITICAL / HIGH
# corrigée en amont dans une image. Les vulnérabilités sans correctif
# disponible sont listées, pas bloquantes (rien à faire côté dépôt).
#
# CodeQL demande GitHub Code Security sur un dépôt privé (Settings → Code
# security → Code scanning) : le job ne s'exécute que lorsque la variable de
# dépôt CODEQL_ENABLED vaut « true » (ou si le dépôt est public).
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Lundi 05:00 UTC : avant la journée, après les publications du week-end.
    - cron: "0 5 * * 1"
  workflow_dispatch:

# Pas d'enregistrement de build (artefact par image) : il compte dans le
# quota de stockage des artefacts, qui a déjà été atteint.
env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets commis (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tout l'historique : un secret retiré au commit suivant reste un secret.
          fetch-depth: 0
      # Le binaire gitleaks (MIT) plutôt que gitleaks-action : l'action exige
      # une licence pour les dépôts d'organisation (GITLEAKS_LICENSE) et le
      # job n'a jamais tourné sans. Version et empreinte figées ; les mettre à
      # jour ensemble (gitleaks_<version>_checksums.txt de la release).
      - name: gitleaks sur tout l'historique
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          cd "$RUNNER_TEMP"
          curl -sSL --fail --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          # --redact : les valeurs trouvées ne sont jamais écrites dans le journal.
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose --no-banner --exit-code 1 .

  python-deps:
    name: Dépendances Python (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
      - name: pip-audit sur le verrou de production
        working-directory: backend
        env:
          UV_PYTHON: "3.14"
          UV_PYTHON_PREFERENCE: only-system
        # Le verrou (uv.lock) est la vérité de l'image : exporté sans le groupe
        # dev ni le projet lui-même, puis audité tel quel (--no-deps : pas de
        # résolution, exactement ces versions).
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project \
            --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --disable-pip --no-deps --strict

  js-deps:
    name: Dépendances JavaScript (pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Les dépendances de production (vitrine, admin, serveur SSR) bloquent dès
      # « moderate » ; l'outillage de dev est audité à titre indicatif.
      - name: Dépendances de production
        run: pnpm audit --prod --audit-level=moderate
      - name: Outillage de développement (indicatif)
        continue-on-error: true
        run: pnpm audit --audit-level=high

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: github.event.repository.visibility == 'public' || vars.CODEQL_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  images:
    name: Image ${{ matrix.image }} (build + Trivy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./backend
            file: ./backend/Dockerfile
          - image: frontend
            context: .
            file: ./frontend/Dockerfile
          - image: admin
            context: .
            file: ./admin-frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Jour UTC : invalide chaque jour la couche « apk/apt upgrade » du cache
      # (ARG SECURITY_UPDATES_DATE des Dockerfile).
      - id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # Même recette que le déploiement (deploy.yml), sans publication : une
      # image qui ne se construit plus est détectée sur la PR, pas le jour du
      # déploiement.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          pull: true
          build-args: |
            VITE_API_URL=https://api.example.invalid
            SECURITY_UPDATES_DATE=${{ steps.today.outputs.date }}
          tags: natimai/${{ matrix.image }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image }}
      - name: Trivy — vulnérabilités corrigées en amont (bloquant)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: natimai/${{ matrix.image }}:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db
      - name: Trivy — vulnérabilités sans correctif (indicatif)
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: natimai/${{ matrix.image }}:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"
          skip-setup-trivy: true
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db
