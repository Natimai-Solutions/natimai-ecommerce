apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: api
          image: ghcr.io/GITHUB_OWNER/REPO_NAME/api:latest
          command: ["api"]
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: ENVIRONMENT
              value: production
            - name: WORKERS
              value: "2"
            - name: CLAMAV_ENABLED
              value: "true"
            - name: CLAMAV_HOST
              value: "clamav"
            - name: CLAMAV_PORT
              value: "3310"
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /api/v1/utils/health-check
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/v1/utils/health-check
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arq-worker
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arq-worker
  template:
    metadata:
      labels:
        app: arq-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/GITHUB_OWNER/REPO_NAME/api:latest
          command: ["worker"]
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: ENVIRONMENT
              value: production
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-poller
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outbox-poller
  template:
    metadata:
      labels:
        app: outbox-poller
    spec:
      containers:
        - name: poller
          image: ghcr.io/GITHUB_OWNER/REPO_NAME/api:latest
          command: ["poller", "--mode", "continuous", "--interval", "5"]
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: ENVIRONMENT
              value: production
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
