# Production docker-compose avec health checking dédié
# Usage (le proxy Caddy est l'unique point d'entrée — cf. DEPLOYMENT.md) :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.proxy.yml up -d

# Rotation des logs Docker — appliquée aux services applicatifs (sinon le
# json-file grossit sans limite et remplit le disque).
x-app-logging: &app-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Service principal API (production optimisé)
  api:
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - RELOAD=false
    restart: unless-stopped
    # Pas d'exposition hôte : Caddy joint api:8000 en interne (et 2 répliques ne
    # peuvent pas partager le port 8000 de l'hôte).
    ports: !reset []
    <<: *app-logging
    networks: [default, dbnet] # egress via default, accès base via dbnet
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
      replicas: 2  # Load balancing

  # ARQ Worker (production optimisé)
  arq-worker:
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    restart: unless-stopped
    <<: *app-logging
    networks: [default, dbnet]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
      replicas: 2  # Parallélisme des jobs

  # Outbox Poller (production optimisé) — 1 réplique MAX (cf. docker-compose.yml)
  outbox-poller:
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - POLL_INTERVAL=5  # Plus fréquent en prod
    restart: unless-stopped
    <<: *app-logging
    networks: [default, dbnet]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # NOUVEAU: Health Checker dédié
  outbox-health-checker:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Ce service n'est defini QUE dans cet override : sans env_file il ne recoit
    # ni SECRET_KEY ni FIRST_SUPERUSER, et les gardes de config.py le font
    # crash-looper en ENVIRONMENT=production.
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - CLAMAV_ENABLED=true
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - LOG_LEVEL=INFO
      - HEALTH_CHECK_INTERVAL=300  # 5 minutes
      - STALE_THRESHOLD_MINUTES=10
      - RECOVERY_ENABLED=true
    command: ["python", "-m", "app.outbox.health_scheduler"]
    restart: unless-stopped
    networks: [default, dbnet]

    # Ressources limitées - service de monitoring léger
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
        reservations:
          memory: 128M
          cpus: '0.1'
    
    # Health check pour le health checker lui-même
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio; from app.outbox.health import health_checker; asyncio.run(health_checker.check_orphaned_jobs())"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    
    # Logging structuré pour monitoring/alerting
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,environment"
    
    # Labels pour monitoring (Prometheus, etc.)
    labels:
      - "app.service=outbox-health-checker"
      - "app.component=monitoring"
      - "app.environment=production"

  # Services de base (production tuning)
  postgres:
    # Sans restart policy, un reboot serveur ou un OOM-kill laisse la base
    # arrêtée — et donc toute la boutique morte.
    restart: unless-stopped
    ports: !reset [] # aucune exposition hôte en prod
    networks: [dbnet] # réseau interne uniquement (pas d'egress, injoignable par le proxy/fronts)
    environment:
      - POSTGRES_LOG_STATEMENT=none  # Moins verbeux en prod
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  redis:
    restart: unless-stopped
    ports: !reset []
    networks: [dbnet]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    volumes:
      - redis_data_prod:/data

  # Migration Alembic (one-shot) — accès base via dbnet.
  migrate:
    networks: [default, dbnet]

  # ClamAV reste sur `default` : freshclam doit joindre Internet (signatures virales).
  clamav:
    ports: !reset []

  # Adminer : hors du stack prod par défaut (surface d'attaque inutile).
  # Pour un débogage ponctuel : docker compose ... --profile debug up -d adminer
  # puis accès via tunnel SSH.
  adminer:
    profiles: ["debug"]
    ports: !reset []
    networks: [dbnet]

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local

networks:
  # Tier data : réseau sans gateway → aucun accès Internet pour postgres/redis,
  # et injoignable depuis le réseau `default` (proxy Caddy, frontends).
  dbnet:
    internal: true