# docker-compose.yml

services:
  postgres:
    image: postgres:16-alpine  # Plus léger avec Alpine
    environment:
      POSTGRES_DB: fastapi_ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.2-alpine  # Version plus spécifique
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 30s

  # Service API FastAPI
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: ["api"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/fastapi_ecommerce
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fastapi_ecommerce
      - REDIS_URL=redis://redis:6379
      - WORKERS=4
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service ARQ Worker
  arq-worker:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/fastapi_ecommerce
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fastapi_ecommerce
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
    restart: unless-stopped

  # Service Outbox Poller
  outbox-poller:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: ["poller", "--mode", "continuous", "--interval", "5"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/fastapi_ecommerce
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fastapi_ecommerce
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
    restart: unless-stopped

  # Migration (optionnel, pour les déploiements)
  migrate:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/fastapi_ecommerce
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fastapi_ecommerce
  adminer:
    image: adminer
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    ports:
      - "8080:8080"
volumes:
  postgres_data:
  redis_data:  # Ajouter volume pour Redis