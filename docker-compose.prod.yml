# Production docker-compose avec health checking dédié
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # Service principal API (production optimisé)
  api:
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - RELOAD=false
    restart: unless-stopped
    networks: [default, dbnet] # egress via default, accès base via dbnet
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
      replicas: 2  # Load balancing

  # ARQ Worker (production optimisé) 
  arq-worker:
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks: [default, dbnet]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
      replicas: 2  # Parallélisme des jobs

  # Outbox Poller (production optimisé)
  outbox-poller:
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - POLL_INTERVAL=5  # Plus fréquent en prod
    restart: unless-stopped
    networks: [default, dbnet]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # NOUVEAU: Health Checker dédié
  outbox-health-checker:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - HEALTH_CHECK_INTERVAL=300  # 5 minutes
      - STALE_THRESHOLD_MINUTES=10
      - RECOVERY_ENABLED=true
    command: ["python", "-m", "app.outbox.health_scheduler"]
    restart: unless-stopped
    networks: [default, dbnet]

    # Ressources limitées - service de monitoring léger
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
        reservations:
          memory: 128M
          cpus: '0.1'
    
    # Health check pour le health checker lui-même
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio; from app.outbox.health import health_checker; asyncio.run(health_checker.check_orphaned_jobs())"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    
    # Logging structuré pour monitoring/alerting
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,environment"
    
    # Labels pour monitoring (Prometheus, etc.)
    labels:
      - "app.service=outbox-health-checker"
      - "app.component=monitoring"
      - "app.environment=production"

  # Services de base (production tuning)
  postgres:
    ports: !reset [] # aucune exposition hôte en prod
    networks: [dbnet] # réseau interne uniquement (pas d'egress, injoignable par le proxy/fronts)
    environment:
      - POSTGRES_LOG_STATEMENT=none  # Moins verbeux en prod
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  redis:
    ports: !reset []
    networks: [dbnet]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    volumes:
      - redis_data_prod:/data

  # Migration Alembic (one-shot) — accès base via dbnet.
  migrate:
    networks: [default, dbnet]

  # ClamAV reste sur `default` : freshclam doit joindre Internet (signatures virales).
  clamav:
    ports: !reset []

  # Adminer : plus d'accès direct :8080 (tunnel SSH / `docker compose exec` si besoin).
  adminer:
    ports: !reset []
    networks: [dbnet]

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local

networks:
  # Tier data : réseau sans gateway → aucun accès Internet pour postgres/redis,
  # et injoignable depuis le réseau `default` (proxy Caddy, frontends).
  dbnet:
    internal: true