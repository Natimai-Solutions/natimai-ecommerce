name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, typecheck, tests & coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: mypy
        working-directory: backend
        run: uv run mypy app/

      - name: pytest (coverage)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fastapi_ecommerce_test
        run: |
          uv run coverage run -m pytest
          uv run coverage xml
          uv run coverage json -o coverage.json
          uv run coverage report

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: |
            backend/coverage.xml
            backend/coverage.json
          if-no-files-found: ignore

  frontend:
    name: Frontend — lint, typecheck & shared tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --filter frontend run lint

      - name: Lint admin
        run: pnpm --filter admin run lint

      - name: Typecheck frontend
        run: pnpm --filter frontend run typecheck

      - name: Typecheck admin
        run: pnpm --filter admin run typecheck

      - name: Shared engine tests (coverage)
        run: pnpm test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: coverage
          if-no-files-found: ignore
