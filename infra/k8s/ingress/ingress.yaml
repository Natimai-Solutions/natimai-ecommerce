# YOURDOMAIN.COM is replaced at deploy time by the DOMAIN GitHub Secret.
# Requires nginx-ingress and cert-manager installed on the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: ecommerce
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - YOURDOMAIN.COM
        - api.YOURDOMAIN.COM
        - admin.YOURDOMAIN.COM
      secretName: ecommerce-tls
  rules:
    - host: YOURDOMAIN.COM
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: api.YOURDOMAIN.COM
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
    - host: admin.YOURDOMAIN.COM
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 80
