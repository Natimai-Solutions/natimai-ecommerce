name: CI

on:
  pull_request:
  push:
    branches: [main]

# Optional PAT (scope `gist`) used to publish the coverage badges to a gist read
# by shields.io. Absent → the badge steps are skipped and CI stays green.
env:
  GIST_SECRET: ${{ secrets.GIST_SECRET }}

jobs:
  # Périmètre d'une PR : chaque job ci-dessous ne tourne que si des fichiers de
  # son périmètre ont changé (une PR qui ne touche que l'admin n'attend ni
  # pytest ni Playwright). Sur `main`, tout tourne toujours : les badges de
  # couverture et la vérification « CI verte » de deploy.yml le supposent.
  # Un job sauté compte comme réussi pour les vérifications requises de la
  # branche (`if:` posé sur le job, pas sur ses étapes). Si ce job échoue, les
  # autres sont sautés et la CI est rouge : jamais un vert par défaut.
  changes:
    name: Périmètre des changements
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      api_types: ${{ steps.filter.outputs.api_types }}
      frontend: ${{ steps.filter.outputs.frontend }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      # Sur un push, l'action compare par git local ; sur une PR, par l'API.
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            api_types:
              - 'backend/**'
              - 'shared/api-types/**'
              - 'scripts/gen-api-types.sh'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'admin-frontend/**'
              - 'shared/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'tsconfig.base.json'
              - 'vitest.config.ts'
              - '.github/workflows/ci.yml'
            stack:
              - 'backend/**'
              - 'frontend/**'
              - 'admin-frontend/**'
              - 'shared/**'
              - 'e2e/**'
              - 'docker-compose*.yml'
              - 'infra/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.env.example'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend — lint, typecheck, tests & coverage
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    # Point the app settings (engine, alembic, initial_data) at the CI services:
    # the defaults ("db", "redis") are docker-compose hostnames that do not
    # resolve on the runner. The app uses its own database so the integration
    # suite's per-test DROP SCHEMA (on fastapi_ecommerce_test) never touches it.
    env:
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapi_ecommerce_app
      REDIS_SERVER: localhost
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fastapi_ecommerce_test
      STRICT_INTEGRATION_DB: "1"
      # Quiet the config UserWarnings — CI-only values, not secrets.
      SECRET_KEY: ci-only-not-a-secret
      FIRST_SUPERUSER: ci-superuser@example.com
      FIRST_SUPERUSER_PASSWORD: ci-only-password
      # The interpreter installed by setup-python below, never a download.
      UV_PYTHON: "3.14"
      UV_PYTHON_PREFERENCE: only-system
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # Same Python as the production image (python:3.14-slim, see
      # backend/Dockerfile): a test run on 3.12 against a 3.14 image let
      # version-specific breakage (uvloop on 3.14) reach the deployment
      # unseen. setup-python gives the latest 3.14.x (an old uv would install
      # a 3.14 release candidate); uv picks it up.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Install dependencies
        working-directory: backend
        # --locked : échoue si uv.lock n'est plus cohérent avec pyproject.toml,
        # au lieu de le régénérer en silence. Sans ce garde-fou, la fusion de
        # deux PR Dependabot touchant toutes deux le lock a produit un fichier
        # désynchronisé sans que rien ne le signale. Équivalent du
        # `pnpm install --frozen-lockfile` déjà utilisé côté JavaScript.
        run: uv sync --locked

      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: mypy
        working-directory: backend
        run: uv run mypy app/

      - name: Alembic — une seule tête de migration
        working-directory: backend
        # Deux branches qui créent chacune une révision produisent deux têtes :
        # `alembic upgrade head` refuse alors de tourner (CI, prestart.sh, donc
        # le déploiement). Le détecter ici, avec un message lisible, plutôt que
        # dans la trace de l'étape suivante. La révision est aussi vérifiée par
        # app/tests/test_alembic_graph.py (utile en local, sans base).
        run: |
          heads="$(uv run alembic heads 2>/dev/null | grep -c '(head)')"
          echo "Têtes Alembic : $heads"
          if [ "$heads" -ne 1 ]; then
            echo "::error::Plusieurs têtes Alembic (ou aucune) : fusionner les révisions avant de merger."
            uv run alembic heads
            exit 1
          fi

      - name: Create, migrate & seed the app database
        working-directory: backend
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -c "CREATE DATABASE fastapi_ecommerce_app"
          uv run alembic upgrade head
          uv run python -m app.initial_data

      - name: pytest (coverage)
        working-directory: backend
        run: |
          uv run coverage run -m pytest
          uv run coverage xml
          uv run coverage json -o coverage.json
          uv run coverage report

      - name: Read backend coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.GIST_SECRET != ''
        id: cov_back
        working-directory: backend
        run: |
          pct=$(uv run python -c "import json;print(round(json.load(open('coverage.json'))['totals']['percent_covered']))")
          echo "pct=$pct" >> "$GITHUB_OUTPUT"

      - name: Backend coverage badge (gist)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.GIST_SECRET != ''
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 9a9268773f32888a2eae4d1b9567efe0
          filename: coverage-backend.json
          label: Backend coverage
          message: ${{ steps.cov_back.outputs.pct }}%
          valColorRange: ${{ steps.cov_back.outputs.pct }}
          minColorRange: 30
          maxColorRange: 90

      # Les rapports sont une commodité (le badge passe par le gist) : un quota
      # de stockage d'artefacts atteint ne doit pas rendre la CI rouge, et une
      # rétention courte évite de l'atteindre (90 jours par défaut).
      - name: Upload backend coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: |
            backend/coverage.xml
            backend/coverage.json
          if-no-files-found: ignore
          retention-days: 7

  api-types:
    name: Types de l'API — dérive de shared/api-types
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.api_types == 'true'
    # Le schéma TypeScript commité est regénéré depuis l'application (sans
    # serveur ni base) et comparé : une route ou un schéma modifié côté
    # backend sans `pnpm gen:types` fait échouer la CI au lieu de laisser les
    # fronts typer une API qui n'existe plus (R8 / U2).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
      - name: Install backend dependencies
        working-directory: backend
        env:
          UV_PYTHON: "3.14"
          UV_PYTHON_PREFERENCE: only-system
        run: uv sync --locked
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Comparer schema.ts à l'API
        env:
          UV_PYTHON: "3.14"
          UV_PYTHON_PREFERENCE: only-system
        run: pnpm check:types

  frontend:
    name: Frontend — lint, typecheck & shared tests
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --filter frontend run lint

      - name: Lint admin
        run: pnpm --filter admin run lint

      - name: Typecheck frontend
        run: pnpm --filter frontend run typecheck

      - name: Typecheck admin
        run: pnpm --filter admin run typecheck

      - name: Shared engine tests (coverage)
        run: pnpm test:coverage

      - name: Read frontend coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.GIST_SECRET != ''
        id: cov_front
        run: echo "pct=$(node -p "Math.round(require('./coverage/coverage-summary.json').total.lines.pct)")" >> "$GITHUB_OUTPUT"

      - name: Frontend coverage badge (gist)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.GIST_SECRET != ''
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 9a9268773f32888a2eae4d1b9567efe0
          filename: coverage-frontend.json
          label: Frontend coverage
          message: ${{ steps.cov_front.outputs.pct }}%
          valColorRange: ${{ steps.cov_front.outputs.pct }}
          minColorRange: 30
          maxColorRange: 90

      - name: Upload frontend coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: coverage
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: E2E — vitrine et admin (Playwright)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.stack == 'true'
    # Vitrine : catalogue → panier → checkout → commande, puis l'espace client.
    # Admin : accès, tableau de bord, chaque écran du menu, validation d'un
    # virement jusqu'à la commande payée, bannière d'accueil publiée sur la
    # vitrine. Paiement par virement manuel : aucune passerelle réelle.
    env:
      # La vitrine tourne sur :3000 ; sans cette origine l'API rejette les
      # appels du NAVIGATEUR en CORS (curl passe, ce qui rend le symptôme
      # trompeur).
      FRONTEND_HOST: http://localhost:3000
      # L'admin (:3001) appelle aussi l'API depuis le navigateur.
      BACKEND_CORS_ORIGINS: http://localhost:3001
      VITE_API_URL: http://localhost:8000
      SECRET_KEY: ci-only-not-a-secret
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: fastapi_ecommerce
      FIRST_SUPERUSER: ci-superuser@example.com
      FIRST_SUPERUSER_PASSWORD: ci-only-password
      CLAMAV_ENABLED: "false"
      ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v4

      - name: Write the root .env consumed by compose
        run: |
          cat > .env <<EOF
          ENVIRONMENT=$ENVIRONMENT
          SECRET_KEY=$SECRET_KEY
          POSTGRES_SERVER=postgres
          POSTGRES_PORT=5432
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$POSTGRES_DB
          REDIS_SERVER=redis
          FIRST_SUPERUSER=$FIRST_SUPERUSER
          FIRST_SUPERUSER_PASSWORD=$FIRST_SUPERUSER_PASSWORD
          FRONTEND_HOST=$FRONTEND_HOST
          BACKEND_CORS_ORIGINS=$BACKEND_CORS_ORIGINS
          VITE_API_URL=$VITE_API_URL
          # Toute la suite se connecte depuis la même IP (une douzaine de
          # connexions en moins d'une minute) : la limite par IP, couverte par
          # les tests backend, est relevée pour cette pile uniquement.
          LOGIN_RATE_LIMIT_ATTEMPTS=1000
          CLAMAV_ENABLED=$CLAMAV_ENABLED
          EOF

      - name: Start the stack
        run: docker compose -f docker-compose.yml up -d --wait postgres redis api frontend admin-frontend

      - name: Migrate & seed
        run: |
          docker compose -f docker-compose.yml run --rm migrate
          docker compose -f docker-compose.yml cp e2e/seed_e2e_data.py api:/app/e2e_seed.py
          docker compose -f docker-compose.yml exec -T api python /app/e2e_seed.py

      # Après la migration : l'approbation d'un paiement passe par l'outbox
      # (poller → worker ARQ) pour faire passer la commande à « payée ».
      - name: Start the background jobs
        run: docker compose -f docker-compose.yml up -d arq-worker outbox-poller

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Run the journeys
        run: pnpm --filter e2e test

      - name: Upload the report on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=200
