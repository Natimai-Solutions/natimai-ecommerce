[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi[standard]<1.0.0,>=0.114.2",
    "python-multipart<1.0.0,>=0.0.7",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "passlib[bcrypt]<2.0.0,>=1.7.4",
    "tenacity<9.0.0,>=8.2.3",
    "pydantic>2.0",
    "jinja2<4.0.0,>=3.1.4",
    "alembic<2.0.0,>=1.12.1",
    "httpx>=0.25.1,<1.0.0",
    "psycopg[binary]<4.0.0,>=3.1.13",
    "sqlmodel<1.0.0,>=0.0.21",
    # Pin bcrypt until passlib supports the latest
    "bcrypt==4.0.1",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]>=2.0.0",
    "pyjwt<3.0.0,>=2.8.0",
    "pillow>=11.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-mock>=3.14.0",
    "arq>=0.26.3",
    "redis>=5.0.0",  # Version plus récente compatible avec Python 3.12
    "aiohttp>=3.8.0",  # Pour les appels API REST Ingram Micro
    "boto3>=1.34.0",  # S3 file storage for payment attachments
    "clamd>=1.0.2",  # ClamAV antivirus scanner for uploaded documents
    "pyyaml>=6.0.0",  # Lecture de spec_definitions.yaml pour les specs filtrables
    # Rendu PDF des factures (M3). Nécessite des libs système (pango, cairo,
    # gdk-pixbuf) présentes dans l'image backend ; l'import est paresseux dans
    # app/features/invoice/services/pdf.py pour qu'un poste dev sans GTK
    # (Windows) ne casse que le rendu PDF.
    "weasyprint>=62.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "mypy>=2.0.0",
    "ruff<1.0.0,>=0.2.2",
    "pre-commit<4.0.0,>=3.6.2",
    "types-passlib<2.0.0.0,>=1.7.7.20240106",
    "coverage<8.0.0,>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
filterwarnings = [
    # passlib imports the stdlib crypt module removed in Python 3.13; not
    # fixable on our side (bcrypt is already pinned for passlib compatibility).
    "ignore:'crypt' is deprecated:DeprecationWarning",
]

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[[tool.mypy.overrides]]
# WeasyPrint ships no type stubs; it is imported lazily in one place
# (app/features/invoice/services/pdf.py) behind a typed wrapper.
module = ["weasyprint.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/tests/*",
    "app/alembic/*",
    "app/scripts/*",
    # External API clients & background tasks: exercised via integration/manual
    # tests, not unit tests (unit-testing them is just HTTP/LLM mocking).
    "app/services/icecat_service.py",
    "app/services/suppliers/ingram_micro.py",
    "app/services/ia_search_agent.py",
    "app/tasks/*",
    # Run-once seeding & ops/monitoring infra.
    "app/features/initial_data.py",
    "app/outbox/health.py",
    "app/outbox/health_scheduler.py",
]

[tool.coverage.report]
show_missing = true
# Gate the build: CI fails when coverage regresses under this % (audit Q2,
# 25/08/2026 — measured ~64.8 % at the current omit scope; raise over time).
fail_under = 60
