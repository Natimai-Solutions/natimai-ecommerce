apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: ecommerce
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/GITHUB_OWNER/REPO_NAME/api:latest
          command: ["migrate"]
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: ENVIRONMENT
              value: production
