# Service de health check dédié pour l'outbox en production
# Ce service surveille la cohérence entre les événements outbox et les jobs ARQ

services:
  # Health checker dédié - recommandé pour la production
  outbox-health-checker:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - HEALTH_CHECK_INTERVAL=300  # 5 minutes
      - STALE_THRESHOLD_MINUTES=10
      - RECOVERY_ENABLED=true
    command: ["python", "-m", "app.outbox.health_scheduler"]
    restart: unless-stopped
    labels:
      - "app.service=outbox-health-checker"
      - "app.environment=${ENVIRONMENT:-production}"
    # Ressources limitées car c'est un service de monitoring léger
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
        reservations:
          memory: 128M
          cpus: '0.1'
    # Monitoring et alerting
    healthcheck:
      test: ["CMD", "python", "-c", "from app.outbox.health import health_checker; import asyncio; asyncio.run(health_checker.check_orphaned_jobs())"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    # Logs structurés pour le monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,environment"