# NOTE (audit 25/08/2026) : ce workflow ne DÉPLOIE rien — il build et pousse des
# images GHCR génériques. La voie de déploiement supportée est docker compose
# AVEC BUILD SUR LE SERVEUR (DEPLOYMENT.md §8) : les images frontends poussées
# ici embarquent le VITE_API_URL par défaut (localhost:8000) et ne sont pas
# utilisables en production telles quelles.
#
# Gating (audit Q1) : déclenché à la FIN du workflow CI sur main, et le job ne
# tourne que si la CI est verte — plus de push d'images `:latest` cassées.
name: Build & Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  # Default value; the build job overrides it with a lowercased version. GHCR
  # repository names must be lowercase, and Actions expressions can't lowercase.
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  build:
    name: Build & push Docker images
    # Ne tourne que si la CI (workflow déclencheur) est verte.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Le commit exact validé par la CI (github.sha pointerait sur le
          # dernier commit de main au moment du déclenchement, pas forcément lui).
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute lowercase image prefix
        run: echo "IMAGE_PREFIX=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/api:latest,${{ env.IMAGE_PREFIX }}/api:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:latest,${{ env.IMAGE_PREFIX }}/frontend:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: admin-frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/admin:latest,${{ env.IMAGE_PREFIX }}/admin:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max