apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clamav-pvc
  namespace: ecommerce
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clamav
  template:
    metadata:
      labels:
        app: clamav
    spec:
      containers:
        - name: clamav
          image: clamav/clamav:stable
          ports:
            - containerPort: 3310
          volumeMounts:
            - name: data
              mountPath: /var/lib/clamav
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
          readinessProbe:
            exec:
              command: ["clamdscan", "--ping", "1"]
            # ClamAV loads its signature database on startup (~2 min)
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["clamdscan", "--ping", "1"]
            initialDelaySeconds: 150
            periodSeconds: 60
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clamav-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: clamav
  namespace: ecommerce
spec:
  selector:
    app: clamav
  ports:
    - port: 3310
      targetPort: 3310
